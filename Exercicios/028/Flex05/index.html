<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        main {
            background-color: aquamarine;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: rgb(145, 52, 52);
            max-width: 500px;
            width: 100%;
            height: 400px;
            text-align: center;
        }
        h1 {
            padding: 10px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Testando centro</h1>
        </section>
    </main>

    
</body>
</html>
