<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>
        main {
            display: grid;
            grid-template: 200px 40% 1fr/ repeat(3, 1fr) 2fr;
            place-items: normal normal;
            border: 1px solid black;
            height: 600px;
        }
        div {
            border: 1px solid red;
        }
        .caixa1 {
            grid-row: 1/2;
            grid-column: 2/4;
            background-color: rgb(61, 61, 226);
        }
        .caixa2 {
            grid-row: 1/-1;
            grid-column: 1/2;
            background-color: rgb(72, 184, 58);
        }
        .caixa3 {
            grid-row: 2/3;
            grid-column: 2/-1;
            background-color: rgb(184, 58, 64);
        }
        .caixa4 {
            grid-row: 3/-1;
            grid-column: 2/-1;
            background-color: rgb(184, 182, 58);
        }
    </style>
</head>
<body>
    <main>
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
        <div class="caixa4">Caixa 4</div>
    </main>
</body>
</html>
