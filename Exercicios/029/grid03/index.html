<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid começo</title>
    <style>
        div#prin {
            display: grid;
            grid-template: 40% repeat(2, 100px)/ 1fr 2fr 1fr;
            place-items: normal normal;
            gap: 10px;
            border: 1px solid black;
            height: 500px;
            grid-auto-flow: row;
        }
        div {
            border: 1px dashed red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <main>
        <div id="prin">
            <div>
                <p>A</p>
            </div>
            <div>
                <p>B</p>
            </div>
            <div>
                <p>C</p>
            </div>
            <div>
                <p>D</p>
            </div>
            <div>
                <p>E</p>
            </div>
            <div>
                <p>F</p>
            </div>
            <div>
                <p>G</p>
            </div>
        </div>
    </main>
</body>
</html>
