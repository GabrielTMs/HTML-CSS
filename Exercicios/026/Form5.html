<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário radio e checkbox</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <p><label for="imasc">Masculino</label> <input type="radio" name="sex" id="imasc"></p>
            <p><label for="ifem">Feminim</label>o <input type="radio" name="sex" id="ifem"></p>
        </fieldset>
        <fieldset>
            <legend>Filmes que gosta</legend>
            <p>Alien <input type="checkbox" name="alien" id="ialien"></p>
            <p>Transformers <input type="checkbox" name="transf" id="itransf"></p>
            <p>Predador <input type="checkbox" name="pred" id="ipred"></p>
            <p>Weapons <input type="checkbox" name="weapo" id="iweapo"></p>
        </fieldset>
    </form>
    
</body>
</html>
