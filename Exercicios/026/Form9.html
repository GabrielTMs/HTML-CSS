<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data usando JavaScript</title>
</head>
<body>
    <h1>Formulário</h1>
    <form action="cadastro.php" method="post">
        <p><label for="inasc">Data de Nascimento</label> 
            <input type="number" name="nasc" id="inasc" min="1920" max="2026" oninput="calcIdade()">
        </p>
        <p><label for="isom">Idade</label>
            <output name="som" id="isom">0</output>
        </p>

    </form>
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            isom.innerHTML= Number(atual) - Number(inasc.value)
        }
    </script>
    
</body>
</html>
