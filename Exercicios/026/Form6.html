<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário color, range e file</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Formulário usando inputs:color/range/file</h1>
    <form action="cadastro.php" method="post">
        <p><label for="icor">Cor</label> <input type="color" name="cor" id="icor"></p>
        <p><label for="isat">Valor de satisfação</label> <input type="range" name="sat" id="isat" min="1" max="5"></p>
        <p><label for="Iimg">Coloque uma imagem</label> <input type="file" name="ima" id="Iimg"></p>

    </form>
    
</body>
</html>
