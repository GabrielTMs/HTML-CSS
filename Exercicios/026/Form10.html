<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satisfação</title>
</head>
<body>
    <h1>Formulário com JavaScript mostrando número</h1>
    <form action="cadastro.php" method="get">
        
        <p><label for="isat">Valor de satisfação:</label>
            <input type="range" name="sat" id="isat" min="0" max="10" value="5" oninput="inum.innerHTML = Number(isat.value)">
            <output name="num" id="inum">5</output>
        </p>
    
    </form>
    
</body>
</html>
