<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemento output</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p><label for="inum1">Número 1:</label> 
            <input type="number" name="num1" id="inum1" oninput="isom.innerHTML = Number(inum1.value)+Number(inum2.value)">
            
        </p>
        <p><label for="inum2">Número 2:</label> 
            <input type="number" name="num2" id="inum2" oninput="isom.innerHTML = Number(inum1.value)+Number(inum2.value)">
        </p>
        <p><label for="isom">Soma</label>
            <output name="som" id="isom">0</output>
        </p>
    </form>
    
</body>
</html>
