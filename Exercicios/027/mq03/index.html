<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query Features</title>
    <style>
        @charset "UTF-8";
        * {
    margin: 0px;
    padding: 0px;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    width: 100vw;
    height: 100vh;
    background-color: rgb(38, 68, 94);
}
h1 {
    color: white;
    text-shadow: 2px 2px 2px rgb(10, 18, 26);
    padding: 10px;
}
@media screen and (orientation: landscape) {
        body {
        background:rgb(38, 68, 94) url(../imagens/cev-landscape.jpg) left bottom/ contain no-repeat scroll;
}

}
@media screen and (orientation: portrait) {

    body {
    background:rgb(38, 68, 94) url(../imagens/cev-portrait.jpg) center bottom/ contain no-repeat scroll;
}
}
    </style>
</head>
<body>
    <h1>Aprendendo media features</h1>
    
</body>
</html>
